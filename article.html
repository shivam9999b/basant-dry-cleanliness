</style>
</head>
<body>

<header class="header">
<div class="container header-inner">
<a href="index.html" class="logo">
<div class="logo-icon">B</div>

<nav class="desktop-nav">

<main class="article-detail-page">

<article id="articleContent" hidden>

<h1 id="articleTitle"></h1>
<div id="articleMeta" class="article-detail-meta"></div>

</article>

Article नहीं मिला।<br><br>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  IMPORTANT:
  यहाँ वही Supabase URL और Publishable/Anon Key डालें
  जो आपके app.js में इस्तेमाल हो रही है.
*/
const SUPABASE_URL = "https://ubsyhqkefhtskxjpjzbf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVic3locWtlZmh0c2t4anBqemJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4Mzk4NjQsImV4cCI6MjEwNTQxNTg2NH0.00-JsYNjdmb7OV51Tly1W8A9grQ9GR9E66E3Yyas-j8";

let supabaseClient = null;

if (SUPABASE_URL && SUPABASE_KEY &&
    !SUPABASE_URL.includes("YOUR_") &&
    !SUPABASE_KEY.includes("YOUR_")) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatContent(text){
  if(!text) return "";
  return String(text).split(/\n\s*\n/)
    .map(p => {
      const clean=p.trim();
      if(!clean) return "";
      return "<p>"+escapeHtml(clean).replace(/\n/g,"<br>")+"</p>";
    }).join("");
}

function formatDate(value){
  if(!value) return "";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("hi-IN",{
    day:"numeric",month:"long",year:"numeric"
  });
}

async function loadArticle(){
  const loading=document.getElementById("articleLoading");
  const article=document.getElementById("articleContent");
  const error=document.getElementById("articleError");

  if(!supabaseClient){
    loading.hidden=true;
    error.hidden=false;
    error.innerHTML="Supabase configuration missing.<br><br><a href='index.html#articles'>← Back to Articles</a>";
    return;
  }

  const id=new URLSearchParams(window.location.search).get("id");

  if(!id){
    loading.hidden=true;
    error.hidden=false;
    return;
  }

  try{
    const {data,error:dbError}=await supabaseClient
      .from("articles")
      .select("id,title,slug,category,description,image_url,content,author,published,created_at")
      .eq("id",id)
      .eq("published",true)
      .maybeSingle();

    if(dbError) throw dbError;

    if(!data){
      loading.hidden=true;
      error.hidden=false;
      return;
    }

    document.title=(data.title || "Article")+" | Basanta Dry Cleanliness";
    document.getElementById("articleCategory").textContent=data.category || "Cleaning & Care";
    document.getElementById("articleTitle").textContent=data.title || "Article";
    document.getElementById("articleMeta").textContent="By "+(data.author || "Basanta")+" • "+formatDate(data.created_at);

    const image=document.getElementById("articleImage");
    if(data.image_url){
      image.src=data.image_url;
      image.alt=data.title || "Article image";
      image.hidden=false;
    }

    document.getElementById("articleBody").innerHTML=formatContent(data.content);

    loading.hidden=true;
    article.hidden=false;
  }catch(err){
    console.error("Article load error:",err);
    loading.hidden=true;
    error.hidden=false;
  }
}

document.addEventListener("DOMContentLoaded",loadArticle);
</script>
</body>
</html>
